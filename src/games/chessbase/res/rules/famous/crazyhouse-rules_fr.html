<h2>Les Échecs, avec retour des pièces prises</h2>
<p>Le Crazyhouse est le jeu d'Échecs orthodoxe à un détail près : une pièce
prise n'est pas hors jeu. Elle change de camp, et celui qui l'a prise pourra
plus tard la reposer sur l'échiquier, où il veut, en guise de coup. Rien
d'autre ne change : les pièces se déplacent comme toujours, le roque et la
prise <i>en passant</i> sont inchangés, et la partie se gagne par échec et
mat.</p>

<p>Les pièces en attente sont dans les deux réserves, une colonne de chaque
côté de l'échiquier. Un chiffre sur une case de réserve indique combien de
pièces de ce type y sont détenues.</p>

<h2>Le parachutage</h2>
<p>Un parachutage est un coup comme un autre : au lieu de déplacer une pièce,
le joueur en prend une dans sa réserve et la pose sur une case vide. Quatre
règles l'encadrent :</p>
<ul>
	<li>Un pion ne peut être parachuté ni sur la première ni sur la huitième
		rangée.</li>
	<li>Un pion parachuté sur sa propre deuxième rangée pourra avancer de deux
		cases, exactement comme un pion qui n'aurait jamais bougé.</li>
	<li>Un parachutage peut donner échec, et peut donner mat - y compris un
		parachutage de pion, ce que le shogi interdit.</li>
	<li>Les pions doublés par parachutage sont autorisés : rien ne limite le
		nombre de pions d'un joueur sur une même colonne.</li>
</ul>
<p>Une tour parachutée sur sa case d'angle ne permet pas de roquer : le roque
exige une tour qui n'a jamais quitté sa case, et celle-ci l'a quittée.</p>

<h2>La promotion</h2>
<p>Un pion atteignant la dernière rangée est promu comme d'habitude. Mais une
pièce promue se souvient de ce qu'elle était : prise, elle rejoint la réserve
en tant que pion, et non en tant que dame ou tour.</p>

<h2>Comment cela se joue</h2>
<p>Les pièces ne valent pas ce qu'elles valent aux Échecs. Le matériel n'est
jamais perdu, seulement prêté : un échange qui gagne un pion arme aussi
l'adversaire d'un pion. Les attaques sont bien plus rapides et bien plus
difficiles à parer : un trou près du roi n'est pas une faiblesse à long terme
mais une faiblesse immédiate, puisqu'une pièce peut y apparaître sans avoir eu
à s'y rendre. Les pions et les cavaliers gagnent en valeur ; les tours, les
fous et la dame en perdent, faute d'échiquier dégagé.</p>
