<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <g id="body">
    <!-- pawn foot -->
    <path d="M 22,92 C 22,86 30,85 32,80 L 68,80 C 70,85 78,86 78,92 Z"/>
    <rect x="20" y="90" width="60" height="5.5" rx="2.75"/>
    <!-- collar -->
    <rect x="30" y="74" width="40" height="7" rx="3.5"/>
    <!-- shoulders, wide enough for the head to read as sitting on them -->
    <path d="M 33,77 C 31,70 33,63 39,58 L 61,58 C 67,63 69,70 67,77 Z"/>
    <!-- the head: one tapered outline, wide at the eyes, narrowing to the nose -->
    <path d="M 50,13
             C 44,13 40,16 38,22
             C 36.4,27 36.2,32 37,36
             C 37.8,40.5 38.6,43.5 40.4,46.5
             C 42,49 42.8,51.5 42.8,55
             L 42.8,58.5
             C 42.8,63 45.8,65.5 50,65.5
             C 54.2,65.5 57.2,63 57.2,58.5
             L 57.2,55
             C 57.2,51.5 58,49 59.6,46.5
             C 61.4,43.5 62.2,40.5 63,36
             C 63.8,32 63.6,27 62,22
             C 60,16 56,13 50,13 Z"/>
    <!-- ears -->
    <path d="M 42.5,18 L 38,3 L 48,16 Z"/>
    <path d="M 57.5,18 L 62,3 L 52,16 Z"/>
    <!-- forelock -->
    <path d="M 50,9 L 45.5,18 L 54.5,18 Z"/>
</g>
    <g id="marks">
    <!-- eyes, on the widest part of the head -->
    <ellipse cx="41.5" cy="31" rx="3" ry="4.1" transform="rotate(-22 41.5 31)"/>
    <ellipse cx="58.5" cy="31" rx="3" ry="4.1" transform="rotate(22 58.5 31)"/>
    <!-- nostrils -->
    <ellipse cx="47.1" cy="60.4" rx="1.5" ry="2" transform="rotate(-22 47.1 60.4)"/>
    <ellipse cx="52.9" cy="60.4" rx="1.5" ry="2" transform="rotate(22 52.9 60.4)"/>
    <!-- inner ears -->
    <path d="M 43.5,16 L 40.2,7 L 46.5,15 Z"/>
    <path d="M 56.5,16 L 59.8,7 L 53.5,15 Z"/>
    <!-- mane, a few strokes over the shoulders -->
    <path d="M 40,60.5 C 37.6,64 36.6,68.5 36.8,72.5 L 39.2,72.5 C 39.1,68.5 40.2,64.5 42.2,61.5 Z"/>
    <path d="M 60,60.5 C 62.4,64 63.4,68.5 63.2,72.5 L 60.8,72.5 C 60.9,68.5 59.8,64.5 57.8,61.5 Z"/>
    <!-- collar line -->
    <rect x="31.5" y="76.4" width="37" height="1.8" rx="0.9"/>
</g>
  </defs>
  <g fill="#000000" transform="translate(50,52) scale(1.055) translate(-50,-52)"><use href="#body"/></g>
  <g fill="#000000"><use href="#body"/></g>
  <g fill="#FFFFFF" color="#FFFFFF"><use href="#marks"/></g>
</svg>
