<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Variantes du jeu d’échecs</title>
    <!-- control.html est désormais la seule page, traduite par js/i18n.js
         depuis lang/<code>.json. Cette adresse reste valable : elle y renvoie
         en français, en gardant ?game=, ?level=... -->
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            if(!params.has("lang"))
                params.set("lang", "fr");
            window.location.replace("control.html?" + params.toString() + window.location.hash);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=control.html?lang=fr"></noscript>
</head>
<body>
    <p><a href="control.html?lang=fr">control.html?lang=fr</a></p>
</body>
</html>
